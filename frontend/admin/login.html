<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>VetClinic SaaS — Admin</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--inset);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:1.5rem;padding:2.5rem;width:100%;max-width:400px;box-shadow:0 25px 60px rgba(0,0,0,.5)}
    input{background:var(--inset);border:1.5px solid var(--border);border-radius:.75rem;padding:.75rem 1rem;color:var(--text);font-size:.88rem;font-family:inherit;outline:none;width:100%;transition:border-color .15s}
    input:focus{border-color:var(--accent)}
    label{display:block;font-size:.72rem;font-weight:600;color:var(--text-muted);margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.08em}
    .btn{width:100%;padding:.85rem;background:var(--accent);color:#fff;border:none;border-radius:.85rem;font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;margin-top:.5rem}
    .btn:hover{opacity:.88}
    .error{color:var(--danger-text);font-size:.78rem;text-align:center;margin-top:.5rem;display:none}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  </style>
  <link rel="stylesheet" href="admin.css?v=20261103b"/>
  <link rel="icon" href="logo.jpg" type="image/jpeg"/>
  <link rel="apple-touch-icon" href="logo.jpg"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#ffffff"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="VetClinic"/>
  <script>try{var t=localStorage.getItem('admin_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
  <div class="card" style="padding:2rem;max-width:400px;width:100%">
    <div style="text-align:center;margin-bottom:2rem">
      <div class="sb-logo logo-img" style="width:72px;height:72px;border-radius:18px;margin:0 auto 1rem"><img src="logo.jpg" alt="VetClinic" onerror="this.parentNode.classList.remove('logo-img');this.remove()"><svg class="ico " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="6.5" cy="10" r="1.9"/><circle cx="10" cy="5.8" r="1.9"/><circle cx="14.5" cy="5.8" r="1.9"/><circle cx="18" cy="10" r="1.9"/><path d="M12.2 11.5c-2.7 0-5.2 3.3-5.2 5.8 0 1.7 1.3 2.5 2.7 2.5 1 0 1.6-.5 2.5-.5s1.5.5 2.5.5c1.4 0 2.7-.8 2.7-2.5 0-2.5-2.5-5.8-5.2-5.8z"/></svg></div>
      <h1 style="font-size:1.5rem;color:var(--text-strong)">Panel SaaS</h1>
      <p style="font-size:.82rem;color:var(--text-muted);margin-top:.3rem">Administración de clínicas VetClinic</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:1rem">
      <div>
        <label>Email</label>
        <input id="email" type="email" placeholder="admin@vetclinic.com"/>
      </div>
      <div>
        <label>Contraseña</label>
        <input id="pass" type="password" placeholder="••••••••"
          onkeydown="if(event.key==='Enter')login()"/>
      </div>
      <button class="btn-primary" style="width:100%;min-height:44px;margin-top:.5rem" onclick="login()" id="btn-login">Ingresar al panel</button>
      <p id="error" class="error"></p>
    </div>
    <p style="text-align:center;font-size:.72rem;color:var(--text-faint);margin-top:2rem">
      Acceso restringido — Solo personal autorizado
    </p>
  </div>

  <script src="admin_shared.js"></script>
  <script>
    // Si ya está logueado, redirigir
    if (isLoggedIn()) window.location.href = 'index.html';

    async function login() {
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('pass').value;
      const btn   = document.getElementById('btn-login');
      const err   = document.getElementById('error');

      if (!email || !pass) { err.textContent = 'Completa todos los campos.'; err.style.display='block'; return; }

      btn.textContent = 'Ingresando…';
      btn.disabled    = true;
      err.style.display = 'none';

      try {
        const res  = await fetch(`${ADMIN_API}/login`, {
          method : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body   : JSON.stringify({ email, password: pass }),
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.message || 'Credenciales inválidas.'; err.style.display='block'; return; }
        localStorage.setItem('admin_token', data.data?.token || data.token);
        localStorage.setItem('admin_user',  JSON.stringify({ nombre: data.data?.nombre || data.nombre, rol: data.data?.rol || data.rol }));
        window.location.href = 'index.html';
      } catch {
        err.textContent = 'Error de conexión.';
        err.style.display = 'block';
      } finally {
        btn.textContent = 'Ingresar al panel';
        btn.disabled    = false;
      }
    }
  </script>
</body>
</html>
