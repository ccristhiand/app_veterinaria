<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Logs de Auditoría — VetClinic SaaS Admin</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--inset);color:var(--text);min-height:100vh}
    .sidebar{width:240px;background:var(--surface);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;border-right:1px solid var(--border);z-index:100;transition:transform .3s}
    .main{margin-left:240px;padding:2rem;min-height:100vh}
    .nav-item{display:flex;align-items:center;gap:.65rem;padding:.65rem .9rem;border-radius:.75rem;font-size:.84rem;font-weight:500;color:var(--text-2);text-decoration:none;transition:all .15s;margin-bottom:2px}
    .nav-item:hover{background:var(--inset);color:var(--text)}
    .nav-item.active{background:linear-gradient(135deg,var(--accent-soft),var(--accent-soft));color:var(--accent-text);font-weight:700}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:1rem;padding:1.5rem}
    table{width:100%;border-collapse:collapse}
    th{padding:.6rem 1rem;text-align:left;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);border-bottom:1px solid var(--border);white-space:nowrap}
    td{padding:.75rem 1rem;border-bottom:1px solid var(--surface);font-size:.8rem;vertical-align:top}
    tr:hover td{background:#0f172a50}
    input,select{background:var(--inset);border:1.5px solid var(--border);border-radius:.7rem;padding:.55rem .85rem;color:var(--text);font-size:.82rem;font-family:inherit;outline:none;transition:border-color .15s}
    input:focus,select:focus{border-color:var(--accent)}
    .btn-primary{background:var(--accent);color:#fff;border:none;padding:.6rem 1.2rem;border-radius:.75rem;cursor:pointer;font-weight:600;font-size:.84rem;font-family:inherit}
    .btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border);padding:.5rem 1rem;border-radius:.7rem;cursor:pointer;font-size:.82rem;font-family:inherit;transition:all .15s}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent-text)}
    .badge-exito{background:var(--ok-bg);color:var(--ok-text);border:1px solid var(--ok-border);font-size:.65rem;font-weight:700;padding:.15rem .45rem;border-radius:999px}
    .badge-error{background:var(--danger-bg);color:var(--danger-text);border:1px solid var(--danger-border);font-size:.65rem;font-weight:700;padding:.15rem .45rem;border-radius:999px}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:1.25rem;width:100%;max-width:700px;max-height:90vh;overflow-y:auto}
    .modal-head{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface)}
    .modal-body{padding:1.5rem;display:flex;flex-direction:column;gap:1rem}
    .hidden{display:none!important}
    .spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
    .json-box{background:var(--inset);border:1px solid var(--border);border-radius:.75rem;padding:1rem;font-family:'Courier New',monospace;font-size:.72rem;color:var(--text-2);overflow-x:auto;white-space:pre-wrap;max-height:300px;overflow-y:auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:768px){
      .sidebar{transform:translateX(-100%)}
      .sidebar.open{transform:translateX(0)}
      .main{margin-left:0;padding:1rem}
      .hide-mobile{display:none!important}
    }
  </style>
  <link rel="stylesheet" href="admin.css?v=20261103b"/>
  <link rel="icon" href="logo.jpg" type="image/jpeg"/>
  <link rel="apple-touch-icon" href="logo.jpg"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#ffffff"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="VetClinic"/>
  <script>try{var t=localStorage.getItem('admin_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar"></aside>

<div id="sidebar-overlay" onclick="toggleSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99"></div>

<main class="main">

  <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap">
    <button onclick="toggleSidebar()" style="background:none;border:none;color:var(--text-2);cursor:pointer;font-size:1.3rem;display:none" id="btn-menu">☰</button>
    <div style="flex:1">
      <h1 style="font-size:1.4rem;color:var(--text-strong)">Logs de auditoría</h1>
      <p style="font-size:.78rem;color:var(--text-faint);margin-top:.1rem">Registro completo de actividad del sistema</p>
    </div>
    <button onclick="cargar()" class="btn-ghost">Actualizar</button>
  </div>

  <!-- Filtros -->
  <div style="display:flex;gap:.75rem;margin-bottom:1.25rem;flex-wrap:wrap;align-items:flex-end">
    <select id="f-tenant" style="max-width:180px" onchange="cargar()">
      <option value="">Todas las clínicas</option>
    </select>
    <select id="f-modulo" style="max-width:150px" onchange="cargar()">
      <option value="">Todos los módulos</option>
      <option value="autenticacion">Autenticación</option>
      <option value="mascotas">Mascotas</option>
      <option value="propietarios">Propietarios</option>
      <option value="citas">Citas</option>
      <option value="historia_clinica">Historia clínica</option>
      <option value="facturacion">Facturación</option>
      <option value="inventario">Inventario</option>
      <option value="vacunas">Vacunas</option>
      <option value="usuarios">Usuarios</option>
      <option value="configuracion">Configuración</option>
    </select>
    <select id="f-resultado" style="max-width:130px" onchange="cargar()">
      <option value="">Todos</option>
      <option value="exito">Éxito</option>
      <option value="error">Error</option>
    </select>
    <input id="f-desde" type="date" style="max-width:150px" onchange="cargar()"/>
    <input id="f-hasta" type="date" style="max-width:150px" onchange="cargar()"/>
    <button onclick="limpiarFiltros()" class="btn-ghost" style="font-size:.78rem">✕ Limpiar</button>
  </div>

  <!-- Tabla -->
  <div class="card" style="padding:0;overflow:hidden">
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Clínica</th>
            <th>Usuario</th>
            <th>Módulo</th>
            <th>Acción</th>
            <th class="hide-mobile">IP</th>
            <th>Resultado</th>
            <th>Detalle</th>
          </tr>
        </thead>
        <tbody id="tbody-logs">
          <tr><td colspan="8" style="text-align:center;padding:2.5rem;color:var(--text-faint)">
            <div style="display:flex;align-items:center;justify-content:center;gap:.75rem"><div class="spinner"></div> Cargando logs…</div>
          </td></tr>
        </tbody>
      </table>
    </div>
    <!-- Paginación -->
    <div style="padding:1rem 1.25rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
      <span id="pag-info" style="font-size:.78rem;color:var(--text-faint)"></span>
      <div style="display:flex;gap:.4rem" id="pag-btns"></div>
    </div>
  </div>

</main>

<!-- Modal Detalle Log -->
<div id="modal-log" class="modal-bg hidden">
  <div class="modal">
    <div class="modal-head">
      <h3 style="font-weight:700;color:var(--text-strong)" id="log-titulo">Detalle del log</h3>
      <button onclick="document.getElementById('modal-log').classList.add('hidden')" class="btn-ghost btn-icon" aria-label="Cerrar"><svg class="ico " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="modal-body" id="log-body"></div>
  </div>
</div>

<script src="admin_shared.js"></script>
<script>
  if (!isLoggedIn()) window.location.href = 'login.html';
  renderSidebar('logs');

  function toggleSidebar() {
    const sb  = document.getElementById('sidebar');
    const ov  = document.getElementById('sidebar-overlay');
    const btn = document.getElementById('btn-close-sb');
    const open = sb.classList.toggle('open');
    ov.style.display  = open ? 'block' : 'none';
    btn.style.display = open ? 'block' : 'none';
  }

  if (window.innerWidth <= 768) document.getElementById('btn-menu').style.display = 'block';

  let paginaActual = 1;

  // Cargar tenants para el filtro
  async function cargarTenants() {
    const res = await adminFetch('/tenants');
    if (!res?.ok) return;
    const rows = (await res.json()).data || [];
    const sel  = document.getElementById('f-tenant');
    rows.forEach(t => {
      const opt = document.createElement('option');
      opt.value       = t.id;
      opt.textContent = t.nombre_clinica || t.slug;
      sel.appendChild(opt);
    });
  }

  async function cargar(pagina = 1) {
    paginaActual = pagina;
    const params = new URLSearchParams({
      page    : pagina,
      limit   : 50,
      tenant_id: document.getElementById('f-tenant').value,
      modulo  : document.getElementById('f-modulo').value,
      resultado: document.getElementById('f-resultado').value,
      desde   : document.getElementById('f-desde').value,
      hasta   : document.getElementById('f-hasta').value,
    });

    const tbody = document.getElementById('tbody-logs');
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text-faint)">
      <div style="display:flex;align-items:center;justify-content:center;gap:.75rem"><div class="spinner"></div> Cargando…</div>
    </td></tr>`;

    try {
      const res  = await adminFetch(`/logs?${params}`);
      if (!res?.ok) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--danger-text)">Error al cargar logs</td></tr>'; return; }
      const { data, meta } = await res.json();

      document.getElementById('pag-info').textContent =
        `${meta.total.toLocaleString()} registros · Página ${meta.page} de ${meta.pages}`;

      // Botones de paginación
      const btns = document.getElementById('pag-btns');
      btns.innerHTML = '';
      if (meta.page > 1) {
        const b = document.createElement('button');
        b.className = 'btn-ghost'; b.style.padding = '.35rem .75rem'; b.style.fontSize = '.78rem';
        b.textContent = '← Anterior'; b.onclick = () => cargar(meta.page - 1);
        btns.appendChild(b);
      }
      if (meta.page < meta.pages) {
        const b = document.createElement('button');
        b.className = 'btn-ghost'; b.style.padding = '.35rem .75rem'; b.style.fontSize = '.78rem';
        b.textContent = 'Siguiente →'; b.onclick = () => cargar(meta.page + 1);
        btns.appendChild(b);
      }

      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text-faint)">Sin logs para los filtros seleccionados</td></tr>';
        return;
      }

      tbody.innerHTML = data.map((log, i) => {
        const fechaStr = fDate(log.created_at);
        // created_at ya viene en hora Lima (con 'Z' falsa): parseServerDate evita restarle 5 h otra vez
        const fechaSrv = parseServerDate(log.created_at);
        const horaStr  = fechaSrv ? fechaSrv.toLocaleTimeString('es-PE', { hour:'2-digit', minute:'2-digit', second:'2-digit', timeZone: ADMIN_TZ }) : '—';
        const moduloIcons = {
          autenticacion:'lock', mascotas:'paw', propietarios:'users', citas:'calendar',
          historia_clinica:'logs', facturacion:'money', inventario:'box', vacunas:'plus',
          usuarios:'users', configuracion:'gear', sistema:'wrench',
        };
        return `<tr style="cursor:pointer" onclick="verDetalle(${i})" data-log-idx="${i}">
          <td style="white-space:nowrap">
            <p style="font-size:.78rem;color:var(--text-strong)">${fechaStr}</p>
            <p style="font-size:.68rem;color:var(--text-faint);font-family:monospace">${horaStr}</p>
          </td>
          <td style="font-size:.78rem;font-weight:600">${esc(log.tenant_nombre||'—')}</td>
          <td>
            <p style="font-size:.78rem">${esc(log.usuario_nombre||'Sistema')}</p>
            <p style="font-size:.65rem;color:var(--text-faint)">${esc(log.usuario_rol||'')}</p>
          </td>
          <td style="white-space:nowrap">
            <span style="display:inline-flex;align-items:center;color:var(--text-muted)">${adminIcon(moduloIcons[log.modulo]||'info','ico-sm')}</span> <span style="font-size:.75rem">${esc(log.modulo)}</span>
          </td>
          <td style="font-size:.75rem;font-family:monospace;color:var(--accent-text)">${esc(log.accion)}</td>
          <td class="hide-mobile" style="font-size:.7rem;color:var(--text-faint);font-family:monospace">${esc(log.ip||'—')}</td>
          <td><span class="badge-${log.resultado}"><span class="dot"></span>${log.resultado}</span></td>
          <td><button onclick="event.stopPropagation();verDetalle(${i})" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:.75rem;font-weight:600">Ver JSON</button></td>
        </tr>`;
      }).join('');

      // Guardar datos para el modal
      window._logsData = data;

    } catch(e) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--danger-text)">Error: ${esc(e.message)}</td></tr>`;
    }
  }

  function verDetalle(idx) {
    const log = window._logsData?.[idx];
    if (!log) return;
    document.getElementById('log-titulo').textContent = `${log.accion}`;
    const fecha = fDateTime(log.created_at);
    document.getElementById('log-body').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem">
        ${[
          ['Clínica', log.tenant_nombre],
          ['Usuario', log.usuario_nombre],
          ['Rol', log.usuario_rol],
          ['Módulo', log.modulo],
          ['Acción', log.accion],
          ['Método', log.metodo_http],
          ['IP', log.ip],
          ['Fecha', fecha],
          ['Duración', log.duracion_ms ? log.duracion_ms+'ms' : '—'],
          ['Resultado', log.resultado],
        ].map(([k,v]) => `
          <div style="background:var(--inset);border-radius:.65rem;padding:.6rem .85rem">
            <p style="font-size:.6rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700">${k}</p>
            <p style="font-size:.82rem;color:var(--text);font-weight:600;margin-top:.15rem">${esc(v||'—')}</p>
          </div>`).join('')}
      </div>
      ${log.endpoint ? `
        <div style="margin-bottom:1rem">
          <p style="font-size:.68rem;color:var(--text-faint);margin-bottom:.35rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em">Endpoint</p>
          <div class="json-box">${esc(log.endpoint)}</div>
        </div>` : ''}
      ${log.error_mensaje ? `
        <div style="margin-bottom:1rem">
          <p style="font-size:.68rem;color:var(--danger-text);margin-bottom:.35rem;font-weight:700">Error</p>
          <div class="json-box" style="border-color:var(--danger-border);color:var(--danger-text)">${esc(log.error_mensaje)}</div>
        </div>` : ''}
      ${log.data_anterior ? `
        <div style="margin-bottom:1rem">
          <p style="font-size:.68rem;color:var(--warn-text);margin-bottom:.35rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em">Data anterior</p>
          <div class="json-box" style="border-color:var(--warn-bg)">${esc(JSON.stringify(JSON.parse(typeof log.data_anterior === 'string' ? log.data_anterior : JSON.stringify(log.data_anterior)), null, 2))}</div>
        </div>` : ''}
      ${log.data_nueva ? `
        <div>
          <p style="font-size:.68rem;color:var(--ok-text);margin-bottom:.35rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em">Data nueva</p>
          <div class="json-box" style="border-color:var(--ok-bg)">${esc(JSON.stringify(JSON.parse(typeof log.data_nueva === 'string' ? log.data_nueva : JSON.stringify(log.data_nueva)), null, 2))}</div>
        </div>` : ''}
    `;
    document.getElementById('modal-log').classList.remove('hidden');
  }

  function limpiarFiltros() {
    ['f-tenant','f-modulo','f-resultado','f-desde','f-hasta'].forEach(id => {
      const el = document.getElementById(id);
      el.value = '';
    });
    cargar();
  }

  cargarTenants();
  cargar();
</script>
</body>
</html>
