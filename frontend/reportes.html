<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <!-- PWA: app instalable (js/pwa.js cambia el manifest por el de la clínica en producción) -->
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="theme-color" content="#0d3b2e"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="VetClinic"/>
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="/icons/favicon-32.png"/>
  <script src="js/pwa.js" defer></script>
  <title>VetClinic — Reportes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/app.css?v=20261103-f4c"/>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/layout.js"></script>
  <!-- xlsx-js-style para Excel con colores y estilos -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <style>
    .rep-tab { padding:.55rem 1rem;border:none;background:none;cursor:pointer;
               font-family:inherit;font-size:.82rem;font-weight:600;color:var(--ink-faint);
               border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s; }
    .rep-tab.active { color:var(--green-600);border-bottom-color:var(--green-500); }
    .kpi { background:#fff;border:1px solid var(--line);border-radius:1rem;
           padding:1.1rem;box-shadow:var(--shadow-sm); }
    .kpi-val { font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;line-height:1; }
    .kpi-label { font-size:.65rem;color:var(--ink-faint);font-weight:700;
                 text-transform:uppercase;letter-spacing:.08em;margin-top:.4rem; }
    .rep-table { width:100%;border-collapse:collapse;font-size:.8rem; }
    .rep-table th { background:#f6f8f6;padding:.6rem .85rem;text-align:left;
                    font-size:.62rem;font-weight:700;letter-spacing:.1em;
                    text-transform:uppercase;color:var(--ink-faint);
                    border-bottom:1px solid var(--line); }
    .rep-table td { padding:.7rem .85rem;border-bottom:1px solid #f2f5f2; }
    .rep-table tr:last-child td { border-bottom:none; }
    /* Celular: la tabla se desplaza dentro de su tarjeta en lugar de ensanchar la página
       (varias tablas de reporte no tienen contenedor con scroll) y los montos no se parten */
    @media (max-width:639px) {
      .rep-table { display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; }
      .rep-table th, .rep-table td { white-space:nowrap; padding:.6rem .7rem; }
      .rep-table td:first-child { white-space:normal; min-width:130px; }
      /* 12 pestañas: en un renglón deslizable en vez de 6 renglones apilados */
      .rep-tabs { flex-wrap:nowrap !important; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
      .rep-tabs::-webkit-scrollbar { display:none; }
      .rep-tabs > * { flex-shrink:0; white-space:nowrap; }
    }
    .bar-h { height:8px;background:#e8ede9;border-radius:999px;overflow:hidden;margin-top:.3rem; }
    .bar-h-fill { height:100%;border-radius:999px;
                  background:linear-gradient(90deg,var(--green-500),var(--green-600));transition:width .5s; }
    .badge-vencida  { background:#fff1f2;color:#be123c;border:1px solid #fecdd3;
                      font-size:.65rem;font-weight:700;padding:.15rem .5rem;border-radius:999px; }
    .badge-proxima  { background:#fffbeb;color:#b45309;border:1px solid #fde68a;
                      font-size:.65rem;font-weight:700;padding:.15rem .5rem;border-radius:999px; }
    .badge-ok       { background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;
                      font-size:.65rem;font-weight:700;padding:.15rem .5rem;border-radius:999px; }
    @media print {
      .no-print { display:none !important; }
      .page { padding:0 !important; }
      .vcard { box-shadow:none !important; }
    }
  </style>
</head>
<body style="display:flex;height:100vh;overflow:hidden">
<div id="main-content" class="page">

  <div class="page-head">
    <div><h2>📈 Reportes</h2><p>Análisis y estadísticas de la clínica</p></div>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap" class="no-print">
      <button onclick="descargarExcel()" class="vbtn vbtn-ghost"
        style="display:inline-flex;align-items:center;gap:.4rem">
        📊 Excel
      </button>
      <button onclick="descargarPDF()" class="vbtn vbtn-ghost"
        style="display:inline-flex;align-items:center;gap:.4rem">
        📄 PDF
      </button>
    </div>
  </div>

  <!-- Filtros de período -->
  <div class="vcard vcard-pad no-print" style="margin-bottom:1.3rem;
    display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end">
    <div><label class="vlabel">Desde</label>
      <input type="date" id="r-desde" class="vinput" style="width:auto"/></div>
    <div><label class="vlabel">Hasta</label>
      <input type="date" id="r-hasta" class="vinput" style="width:auto"/></div>
    <button onclick="cargarReporte()" class="vbtn vbtn-primary">🔍 Generar</button>
    <button onclick="setPeriodo('hoy')"    class="vbtn vbtn-ghost">Hoy</button>
    <button onclick="setPeriodo('semana')" class="vbtn vbtn-ghost">Esta semana</button>
    <button onclick="setPeriodo('mes')"    class="vbtn vbtn-ghost">Este mes</button>
    <button onclick="setPeriodo('anio')"   class="vbtn vbtn-ghost">Este año</button>
    <!-- Selector sede admin — aparece solo si hay varias sedes -->
    <div id="selector-sede-reportes" style="display:none;margin-left:auto"></div>
  </div>

  <!-- Tabs (en celular se deslizan con el dedo: .vtabs anula el flex-wrap) -->
  <div style="display:flex;gap:.2rem;border-bottom:2px solid var(--line);
    margin-bottom:1.3rem;flex-wrap:wrap" class="no-print rep-tabs">
    <button class="rep-tab active" id="tab-resumen" onclick="mostrarTab('resumen')">🧭 Resumen</button>
    <button class="rep-tab" id="tab-financiero"   onclick="mostrarTab('financiero')">💰 Financiero</button>
    <button class="rep-tab" id="tab-gastos"       onclick="mostrarTab('gastos')">💸 Gastos</button>
    <button class="rep-tab" id="tab-clientes"     onclick="mostrarTab('clientes')">👥 Clientes</button>
    <button class="rep-tab" id="tab-cobranzas"    onclick="mostrarTab('cobranzas')">🧾 Cobranzas</button>
    <button class="rep-tab" id="tab-citas"        onclick="mostrarTab('citas')">📅 Citas</button>
    <button class="rep-tab" id="tab-demanda"      onclick="mostrarTab('demanda')">🕒 Demanda</button>
    <button class="rep-tab" id="tab-mascotas"     onclick="mostrarTab('mascotas')">🐾 Mascotas</button>
    <button class="rep-tab" id="tab-vacunas"      onclick="mostrarTab('vacunas')">💉 Vacunas</button>
    <button class="rep-tab" id="tab-inventario"   onclick="mostrarTab('inventario')">📦 Inventario</button>
    <button class="rep-tab" id="tab-estetica"     onclick="mostrarTab('estetica')">✂️ Estética</button>
    <button class="rep-tab" id="tab-veterinarios" onclick="mostrarTab('veterinarios')">🩺 Veterinarios</button>
    <button class="rep-tab" id="tab-rentabilidad" onclick="mostrarTab('rentabilidad')">💹 Rentabilidad</button>
  </div>

  <!-- Contenidos -->
  <div id="contenido-resumen">
    <div class="vempty"><div class="vspinner"></div><p>Generando reporte…</p></div>
  </div>
  <div id="contenido-financiero"   style="display:none"></div>
  <div id="contenido-gastos"       style="display:none"></div>
  <div id="contenido-clientes"     style="display:none"></div>
  <div id="contenido-cobranzas"    style="display:none"></div>
  <div id="contenido-citas"        style="display:none"></div>
  <div id="contenido-demanda"      style="display:none"></div>
  <div id="contenido-mascotas"     style="display:none"></div>
  <div id="contenido-vacunas"      style="display:none"></div>
  <div id="contenido-inventario"   style="display:none"></div>
  <div id="contenido-estetica"     style="display:none"></div>
  <div id="contenido-veterinarios" style="display:none"></div>
  <div id="contenido-rentabilidad" style="display:none"></div>

  <!-- Comparativa por sede (solo admin, sin filtro de sede específica) -->
  <div id="seccion-por-sede" style="display:none;margin-top:1.5rem">
    <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;padding:.75rem 1rem;background:var(--green-50);border-radius:.85rem;border:1px solid var(--green-200)">
      <span style="font-size:1.2rem">🏥</span>
      <div>
        <p style="font-weight:700;font-size:.9rem;color:var(--green-700)">Comparativa por sede</p>
        <p style="font-size:.72rem;color:#6b7280">Distribución de actividad entre sedes — período seleccionado</p>
      </div>
    </div>
    <div id="sede-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.85rem">
      <p style="color:var(--ink-faint);font-size:.8rem;text-align:center;padding:1rem;grid-column:1/-1">Genera un reporte para ver la comparativa</p>
    </div>
  </div>

</div>




<script>
// Estado global de datos cargados
const datosReporte = {};
const TABS = ['resumen','financiero','gastos','clientes','cobranzas','citas','demanda','mascotas','vacunas','inventario','estetica','veterinarios','rentabilidad'];
let tabActiva = 'resumen';
let _diasInactivo = 180;


function renderPorSede(data, tab) {
  // Solo mostrar para admin sin filtro de sede específica
  var seccion = document.getElementById('seccion-por-sede');
  if (!seccion) return;

  if (!isAdmin() || _reporteSedeActiva) {
    seccion.style.display = 'none';
    return;
  }

  var porSede = data.porSede || [];
  if (!porSede.length) {
    seccion.style.display = 'none';
    return;
  }

  seccion.style.display = 'block';

  // Calcular totales para porcentajes
  var totalCitas = porSede.reduce(function(a,s){ return a+(parseInt(s.total_citas||s.total)||0); },0);
  var totalFact  = porSede.reduce(function(a,s){ return a+(parseFloat(s.ingresos)||0); },0);
  var totalAten  = porSede.reduce(function(a,s){ return a+(parseInt(s.total_atenciones)||0); },0);

  // Cards por sede
  var cards = porSede.map(function(s) {
    var citas  = parseInt(s.total_citas || s.total || 0);
    var fact   = parseFloat(s.ingresos || 0);
    var aten   = parseInt(s.total_atenciones || 0);
    var pctC   = totalCitas > 0 ? Math.round((citas/totalCitas)*100) : 0;
    var pctF   = totalFact  > 0 ? Math.round((fact/totalFact)*100)  : 0;

    return '<div style="background:#fff;border:1px solid var(--line);border-radius:1rem;padding:1rem;display:flex;flex-direction:column;gap:.5rem">' +
      '<div style="display:flex;align-items:center;justify-content:space-between">' +
        '<p style="font-weight:700;font-size:.9rem">' + esc(s.sede||'Sin sede') + '</p>' +
        '<span style="font-size:.65rem;background:#f0f9ff;color:#0369a1;padding:.2rem .6rem;border-radius:999px;border:1px solid #bae6fd;font-weight:700">🏥 Sede</span>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-top:.25rem">' +
        sedeStatCard('📅', citas, 'Citas', pctC + '%', '#6366f1') +
        sedeStatCard('📋', aten || (data.porSede ? 'N/A' : 0), 'Atenciones', '', 'var(--green-500)') +
        sedeStatCard('💰', 'S/.' + fact.toFixed(0), 'Facturado', pctF + '%', '#f59e0b') +
      '</div>' +
      (citas > 0 || fact > 0 ? '<div style="height:4px;background:#f1f5f9;border-radius:999px;overflow:hidden;margin-top:.25rem">' +
        '<div style="height:100%;width:' + pctF + '%;background:linear-gradient(90deg,#6366f1,var(--green-500));border-radius:999px;transition:width .5s"></div>' +
      '</div>' : '') +
    '</div>';
  }).join('');

  document.getElementById('sede-cards').innerHTML = cards || '<p style="color:var(--ink-faint);font-size:.8rem;text-align:center;padding:1rem">Sin datos para el período</p>';
}

function sedeStatCard(icon, valor, label, pct, color) {
  return '<div style="text-align:center;padding:.4rem;background:#f8fafc;border-radius:.65rem">' +
    '<p style="font-size:1rem;font-weight:800;color:' + color + '">' + valor + '</p>' +
    '<p style="font-size:.6rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em">' + label + '</p>' +
    (pct ? '<p style="font-size:.65rem;font-weight:600;color:' + color + '">' + pct + '</p>' : '') +
  '</div>';
}


var _filtroRent = 'todos';
var _reporteSedeActiva = null;

function cambiarFiltroRent(filtro) {
  _filtroRent = filtro;
  delete datosReporte['rentabilidad'];
  cargarTab('rentabilidad');
}

document.addEventListener('DOMContentLoaded', () => {
  initPage({ activePage:'reportes', title:'Reportes', subtitle:'Análisis y estadísticas' });
  const hoy = new Date();
  document.getElementById('r-desde').value = `${hoy.getFullYear()}-${pad(hoy.getMonth()+1)}-01`;
  document.getElementById('r-hasta').value = fechaHoyInput();
  // Selector de sede para admin
  initSelectorSede('selector-sede-reportes', function(sedeId) {
    _reporteSedeActiva = sedeId;
    cargarReporte();
  }, { label: 'Sede:', labelTodas: '🏥 Todas las sedes', size: 'small', inline: true });
  cargarReporte();
});

function pad(n) { return String(n).padStart(2,'0'); }

function setPeriodo(p) {
  const hoy  = new Date();
  const fmt  = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const desde = new Date(hoy);
  if      (p==='hoy')    { /* mismo día */ }
  else if (p==='semana') { desde.setDate(hoy.getDate() - ((hoy.getDay() + 6) % 7)); }  // lunes de esta semana
  else if (p==='mes')    { desde.setDate(1); }
  else if (p==='anio')   { desde.setMonth(0); desde.setDate(1); }
  document.getElementById('r-desde').value = fmt(desde);
  document.getElementById('r-hasta').value = fmt(hoy);
  cargarReporte();
}

function mostrarTab(tab) {
  tabActiva = tab;
  TABS.forEach(t => {
    document.getElementById(`tab-${t}`)?.classList.toggle('active', t===tab);
    const el = document.getElementById(`contenido-${t}`);
    if (el) el.style.display = t===tab ? 'block' : 'none';
  });
  // En celular las pestañas se deslizan: traer la activa a la vista
  const btn = document.getElementById(`tab-${tab}`), barra = btn?.parentElement;
  if (barra && barra.scrollWidth > barra.clientWidth) {
    barra.scrollTo({ left: btn.offsetLeft - barra.offsetLeft - 16, behavior: 'smooth' });
  }
  // Cargar si no está cargado aún
  if (!datosReporte[tab]) cargarTab(tab);
}

async function cargarReporte() {
  // Limpiar caché y recargar tab activa
  Object.keys(datosReporte).forEach(k => delete datosReporte[k]);
  TABS.forEach(t => {
    const el = document.getElementById(`contenido-${t}`);
    if (el) el.innerHTML = `<div class="vempty"><div class="vspinner"></div><p>Generando…</p></div>`;
  });
  cargarTab(tabActiva);
}

async function cargarTab(tab) {
  const desde = document.getElementById('r-desde').value;
  const hasta = document.getElementById('r-hasta').value;
  const cont  = document.getElementById(`contenido-${tab}`);
  cont.innerHTML = `<div class="vempty"><div class="vspinner"></div><p>Cargando…</p></div>`;
  cont.style.display = 'block';

  try {
    let endpoint = tab === 'veterinarios' ? 'veterinarios' : tab;
    const sedeParam   = _reporteSedeActiva ? `&sede_id=${_reporteSedeActiva}` : '';
    const filtroParam = tab === 'rentabilidad' ? `&filtro=${_filtroRent}` : tab === 'clientes' ? `&dias_inactivo=${_diasInactivo}` : '';
    const res  = await api(`/reportes/${endpoint}?desde=${desde}&hasta=${hasta}${sedeParam}${filtroParam}`);
    if (!res?.ok) { cont.innerHTML=`<div class="vempty"><span class="icon">😿</span><p>Error al cargar.</p></div>`; return; }
    const d = (await res.json()).data;
    datosReporte[tab] = d;
    renderTab(tab, d, cont);
    renderPorSede(d);
  } catch(e) {
    cont.innerHTML = `<div class="vempty"><span class="icon">😿</span><p>Error: ${e.message}</p></div>`;
  }
}

function renderTab(tab, d, cont) {
  switch(tab) {
    case 'financiero':   cont.innerHTML = renderFinanciero(d);   break;
    case 'gastos':       cont.innerHTML = renderGastos(d);       break;
    case 'citas':        cont.innerHTML = renderCitas(d);        break;
    case 'mascotas':     cont.innerHTML = renderMascotas(d);     break;
    case 'vacunas':      cont.innerHTML = renderVacunas(d);      break;
    case 'inventario':   cont.innerHTML = renderInventario(d);   break;
    case 'estetica':     cont.innerHTML = renderEstetica(d);     break;
    case 'veterinarios': cont.innerHTML = renderVeterinarios(d); break;
    case 'rentabilidad': cont.innerHTML = renderRentabilidad(d); break;
    case 'resumen':      cont.innerHTML = renderResumen(d);      break;
    case 'clientes':     cont.innerHTML = renderClientes(d);     break;
    case 'cobranzas':    cont.innerHTML = renderCobranzas(d);    break;
    case 'demanda':      cont.innerHTML = renderDemanda(d);      break;
  }
}

// ════════════════════════════════════════════════════════════════
//  Reportes para decidir: Resumen, Clientes, Cobranzas, Demanda
// ════════════════════════════════════════════════════════════════
const money = n => 'S/. ' + (parseFloat(n) || 0).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fCorta = f => f ? String(f).slice(0, 10).split('-').reverse().slice(0, 2).join('/') : '—';
const titulo = (t, sub) => `<h3 style="font-family:'Playfair Display',serif;font-weight:700;margin-bottom:${sub ? '.2rem' : '1rem'}">${t}</h3>` +
  (sub ? `<p style="font-size:.75rem;color:var(--ink-faint);margin-bottom:1rem">${sub}</p>` : '');
const vacio = msg => `<p style="color:var(--ink-faint);font-size:.8rem;padding:.5rem 0">${msg}</p>`;

// Variación vs período anterior. invertir=true cuando subir es malo (ej. cancelaciones).
function deltaHtml(v, invertir) {
  if (v === null) return '<span style="color:var(--green-700);font-weight:700">nuevo</span>';
  if (!v) return '<span style="color:var(--ink-faint)">sin cambio</span>';
  const bueno = invertir ? v < 0 : v > 0;
  return `<span style="color:${bueno ? '#15803d' : '#be123c'};font-weight:700">${v > 0 ? '▲' : '▼'} ${Math.abs(v)}%</span>`;
}
function kpiComp(val, label, delta, anterior, invertir) {
  return `<div class="kpi">
    <p class="kpi-val" style="color:#1a2e28">${val}</p>
    <p class="kpi-label">${label}</p>
    <p style="font-size:.72rem;margin-top:.5rem">${deltaHtml(delta, invertir)} <span style="color:var(--ink-faint)">vs ${anterior}</span></p>
  </div>`;
}
// Link de WhatsApp (asume Perú si el número tiene 9 dígitos)
function waLink(tel, texto) {
  let n = String(tel || '').replace(/\D/g, '');
  if (!n) return '';
  if (n.length === 9) n = '51' + n;
  return `<a href="https://wa.me/${n}?text=${encodeURIComponent(texto)}" target="_blank" rel="noopener"
    class="vbtn vbtn-ghost" style="padding:.25rem .6rem;font-size:.72rem;white-space:nowrap">WhatsApp</a>`;
}

function renderResumen(d) {
  const a = d.actual, p = d.anterior, c = d.cambio, al = d.alertas;
  const pa = `${fCorta(d.periodo_anterior.desde)}–${fCorta(d.periodo_anterior.hasta)}`;

  // Alertas accionables: solo las que tienen algo
  const alertas = [
    al.por_cobrar_30 > 0      && { txt: `${money(al.por_cobrar_30)} por cobrar con más de 30 días`, tab: 'cobranzas', color: '#be123c' },
    al.vacunas_vencidas_30 > 0 && { txt: `${al.vacunas_vencidas_30} vacunas vencidas en el último mes sin reaplicar`, tab: 'vacunas', color: '#be123c' },
    al.vacunas_proximas_7 > 0  && { txt: `${al.vacunas_proximas_7} vacunas vencen en los próximos 7 días`, tab: 'vacunas', color: '#b45309' },
    al.stock_bajo > 0          && { txt: `${al.stock_bajo} productos con stock bajo`, tab: 'inventario', color: '#b45309' },
    al.inventario_por_vencer > 0 && { txt: `${al.inventario_por_vencer} productos vencen en 30 días`, tab: 'inventario', color: '#b45309' },
  ].filter(Boolean);

  // Lectura automática de los números
  const ideas = [];
  if (c.ingresos !== null && c.ingresos <= -10) ideas.push(`Los ingresos bajaron ${Math.abs(c.ingresos)}% frente al período anterior. Revisa en <b>Clientes</b> a los que dejaron de venir.`);
  if (c.ingresos > 10) ideas.push(`Los ingresos subieron ${c.ingresos}%. Mira en <b>Financiero</b> qué servicios lo impulsaron.`);
  if (a.tasa_cancelacion >= 15) ideas.push(`El ${a.tasa_cancelacion}% de las citas se cancela. Activar recordatorios por WhatsApp suele reducirlo.`);
  if (c.ticket_promedio !== null && c.ticket_promedio <= -10) ideas.push(`El ticket promedio cayó ${Math.abs(c.ticket_promedio)}%: conviene ofrecer servicios complementarios (vacunas, desparasitación, estética).`);
  if (a.clientes_atendidos > 0 && a.clientes_nuevos === 0) ideas.push('No hubo clientes nuevos en el período. Considera una campaña de captación o referidos.');

function renderDemanda(d) {
  // DAYOFWEEK de MySQL: 1=domingo … 7=sábado → filas de lunes a domingo
  const dias = [[2, 'Lun'], [3, 'Mar'], [4, 'Mié'], [5, 'Jue'], [6, 'Vie'], [7, 'Sáb'], [1, 'Dom']];
  const celda = {}; let max = 0;
  const porDia = {}, porHora = {}, cancelDia = {};
  for (const m of d.mapa) {
    const t = +m.total;
    celda[`${m.dow}-${m.hora}`] = t; max = Math.max(max, t);
    porDia[m.dow] = (porDia[m.dow] || 0) + t;
    porHora[m.hora] = (porHora[m.hora] || 0) + t;
    cancelDia[m.dow] = (cancelDia[m.dow] || 0) + (+m.canceladas || 0);
  }
  const total = Object.values(porDia).reduce((a, b) => a + b, 0);
  if (!total) return `<div class="vcard vcard-pad">${vacio('No hay citas en el período para analizar la demanda.')}</div>`;

  const horas = Object.keys(porHora).map(Number);
  const hMin = Math.min(...horas, 8), hMax = Math.max(...horas, 19);
  const rango = Array.from({ length: hMax - hMin + 1 }, (_, i) => hMin + i);
  const picoHora = Object.entries(porHora).sort((a, b) => b[1] - a[1])[0];
  const picoDia  = dias.map(([n, l]) => [l, porDia[n] || 0]).sort((a, b) => b[1] - a[1])[0];
  const flojoDia = dias.map(([n, l]) => [l, porDia[n] || 0]).filter(x => x[1] > 0).sort((a, b) => a[1] - b[1])[0];
  const tipos = { medica: 'Consulta médica', vacuna: 'Vacunación', desparasitacion: 'Desparasitación', estetica: 'Estética' };

  return `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4" style="margin-bottom:1.3rem">
      ${kpi(total, 'Citas en el período', '#1d4ed8')}
      ${kpi(`${picoHora[0]}:00`, 'Hora más demandada', 'var(--green-700)')}
      ${kpi(picoDia[0], 'Día más fuerte', '#6d28d9')}
      ${kpi(flojoDia ? flojoDia[0] : '—', 'Día más flojo', '#b45309')}
    </div>
    <div class="vcard vcard-pad" style="margin-bottom:1.3rem">
      ${titulo('🗓️ Mapa de demanda', 'Citas por día y hora. Úsalo para organizar turnos y lanzar promociones en las horas flojas.')}
      <div style="overflow-x:auto">
        <table style="border-collapse:separate;border-spacing:3px;font-size:.72rem;min-width:100%">
          <thead><tr><th></th>${rango.map(h => `<th style="font-weight:600;color:var(--ink-faint);padding:0 2px">${h}h</th>`).join('')}
            <th style="padding-left:.5rem;color:var(--ink-faint)">Total</th><th style="color:var(--ink-faint)">Cancel.</th></tr></thead>
          <tbody>${dias.map(([n, l]) => `<tr>
            <td style="font-weight:700;padding-right:.4rem">${l}</td>
            ${rango.map(h => {
              const v = celda[`${n}-${h}`] || 0;
              const a = v ? 0.15 + (v / max) * 0.85 : 0;
              return `<td title="${l} ${h}:00 — ${v} citas" style="width:32px;height:28px;text-align:center;border-radius:5px;
                background:${v ? `rgba(var(--brand-rgb),${a.toFixed(2)})` : '#f3f5f3'};color:${a > 0.55 ? '#fff' : '#1a2e28'};font-weight:600">${v || ''}</td>`;
            }).join('')}
            <td style="padding-left:.5rem;font-weight:700">${porDia[n] || 0}</td>
            <td style="color:#be123c">${porDia[n] ? Math.round(((cancelDia[n] || 0) / porDia[n]) * 100) + '%' : '—'}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="vcard" style="overflow:hidden">
        <div style="padding:1rem 1.25rem;border-bottom:1px solid var(--line)">${titulo('🩺 Por tipo de atención')}</div>
        <table class="rep-table"><thead><tr><th>Tipo</th><th>Citas</th><th>Completadas</th><th>Canceladas</th></tr></thead>
          <tbody>${d.porTipo.map(t => `<tr><td style="font-weight:600">${tipos[t.tipo_cita] || esc(t.tipo_cita)}</td>
            <td>${t.total}</td><td style="color:#15803d">${t.completadas}</td><td style="color:#be123c">${t.canceladas}</td></tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="vcard vcard-pad">
        ${titulo('📝 Motivos más frecuentes')}
        ${d.motivos.length ? d.motivos.map(m => `
          <div style="margin-bottom:.55rem">
            <div style="display:flex;justify-content:space-between;font-size:.78rem"><span style="text-transform:capitalize">${esc(m.motivo)}</span><b>${m.total}</b></div>
            <div class="bar-h"><div class="bar-h-fill" style="width:${(m.total / d.motivos[0].total) * 100}%"></div></div>
          </div>`).join('') : vacio('Sin motivos registrados.')}
      </div>
    </div>`;
}

// ── GASTOS ────────────────────────────────────────────────────────
const MET_GASTO = { efectivo:'💵 Efectivo', tarjeta:'💳 Tarjeta', transferencia:'🏦 Transferencia', yape:'📱 Yape', plin:'📱 Plin' };
// 'YYYY-MM-DD' o 'YYYY-MM' sin corrimiento de zona horaria
function fPeriodoGasto(p, mes) {
  if (!p) return '—';
  if (mes) { const [y, m] = p.split('-'); return new Date(Date.UTC(+y, +m - 1, 1)).toLocaleDateString('es-PE', { month:'short', year:'numeric', timeZone:'UTC' }); }
  return new Date(`${p}T00:00:00Z`).toLocaleDateString('es-PE', { day:'2-digit', month:'short', year:'numeric', timeZone:'UTC' });
}

        <p class="kpi-label">vs período anterior (${money(r.anterior)})</p>
      </div>
      ${kpi(money(r.ingresos), 'Ingresos cobrados', 'var(--green-700)')}
      <div class="kpi">
        <p class="kpi-val" style="color:${r.utilidad < 0 ? '#be123c' : 'var(--green-700)'}">${money(r.utilidad)}</p>
        <p class="kpi-label">Ingresos − gastos${r.margen !== null ? ` · margen ${r.margen}%` : ''}</p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4" style="margin-bottom:1.3rem">
      <div class="vcard vcard-pad">
        ${titulo('📊 ¿En qué gastamos? — por tipo')}
        ${d.porCategoria.length ? d.porCategoria.map(c => `
          <div style="margin-bottom:.7rem">
            <div style="display:flex;justify-content:space-between;gap:.5rem;font-size:.8rem;margin-bottom:.22rem">

              <span style="font-weight:700">${money(c.total)} <span style="color:var(--ink-faint);font-weight:400">(${c.pct}%)</span></span>
            </div>
            <div class="bar-h"><div class="bar-h-fill" style="width:${Math.max((c.total / maxCat) * 100, 2)}%;background:${esc(c.color || '#64748b')}"></div></div>
          </div>`).join('') : vacio('Sin gastos en el período.')}
      </div>
      <div class="vcard vcard-pad">

        ${d.porMetodo.length ? d.porMetodo.map(m => `
          <div style="margin-bottom:.7rem">
            <div style="display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:.22rem">

          ${d.porPeriodo.map(x => `<div>

}

function renderMetodosPago(data) {
  if (!data?.length) return '<p style="color:var(--ink-faint);font-size:.8rem">Sin pagos en el período.</p>';
  const icons = { efectivo:'💵 Efectivo', tarjeta:'💳 Tarjeta', transferencia:'🏦 Transfer.', yape:'📱 Yape', plin:'📱 Plin' };
  const total = data.reduce((a,b)=>a+parseFloat(b.monto||0),0);
  return data.map(m=>{
    const pct = total>0?((parseFloat(m.monto)/total)*100).toFixed(0):0;
    return `<div style="margin-bottom:.75rem">
      <div style="display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:.25rem">
        <span style="font-weight:600">${icons[m.metodo_pago]||m.metodo_pago}</span>
        <span style="font-weight:700;color:var(--green-700)">S/. ${parseFloat(m.monto).toFixed(2)} <span style="color:var(--ink-faint);font-weight:400">(${pct}%)</span></span>

      <div class="bar-h"><div class="bar-h-fill" style="width:${pct}%"></div></div>
      <p style="font-size:.65rem;color:var(--ink-faint);margin-top:.1rem">${m.transacciones} transacciones</p>

  }).join('');
}

// ── EXCEL con estilos (xlsx-js-style) ────────────────────────────
function descargarExcel() {
  const d     = datosReporte[tabActiva];
  const desde = document.getElementById('r-desde').value;
  const hasta = document.getElementById('r-hasta').value;
  const titulos = {
    financiero:'Financiero', gastos:'Gastos', citas:'Citas', mascotas:'Mascotas',
    vacunas:'Vacunas', inventario:'Inventario', estetica:'Estética',
    veterinarios:'Veterinarios', resumen:'Resumen', clientes:'Clientes',
    cobranzas:'Cobranzas', demanda:'Demanda'
  };
  const titulo = titulos[tabActiva] || tabActiva;
  if (!d) { toast('Genera el reporte primero.','warning'); return; }

  // Usar XLSXStyle (xlsx-js-style)
  const XS = window.XLSXStyle || window.XLSX;

  // ── Estilos ───────────────────────────────────────────────────
  const VERDE_OSCURO = '166534';
  const VERDE_CLARO  = 'ECFDF5';
  const GRIS_FILA    = 'F6F8F6';
  const BLANCO       = 'FFFFFF';
  const NEGRO        = '1A2E28';

  const sTitulo = {
    font : { bold:true, sz:14, color:{ rgb:BLANCO } },
    fill : { fgColor:{ rgb:VERDE_OSCURO } },
    alignment: { horizontal:'left', vertical:'center' },
    border: bordesTodos(BLANCO),
  };
  const sSubtitulo = {
    font : { bold:true, sz:10, color:{ rgb:'4B5F57' } },
    fill : { fgColor:{ rgb:VERDE_CLARO } },
    alignment: { horizontal:'left' },
  };
  const sHeader = {
    font : { bold:true, sz:10, color:{ rgb:BLANCO } },
    fill : { fgColor:{ rgb:VERDE_OSCURO } },
    alignment: { horizontal:'center', vertical:'center', wrapText:true },
    border: bordesTodos('FFFFFF'),
  };
  const sHeaderLeft = { ...sHeader, alignment:{ horizontal:'left', vertical:'center' } };
  const sFila = (par) => ({
    font : { sz:10, color:{ rgb:NEGRO } },
    fill : { fgColor:{ rgb: par ? GRIS_FILA : BLANCO } },
    alignment: { horizontal:'left', vertical:'center' },
    border: bordesTodos('E8EDE9'),
  });
  const sFilaNum = (par) => ({
    ...sFila(par),
    alignment: { horizontal:'right', vertical:'center' },
  });
  const sFilaVerde = (par) => ({
    ...sFilaNum(par),
    font: { sz:10, bold:true, color:{ rgb:VERDE_OSCURO } },
  });
  const sFilaRojo = (par) => ({
    ...sFilaNum(par),
    font: { sz:10, bold:true, color:{ rgb:'BE123C' } },
  });
  const sFilaAmbar = (par) => ({
    ...sFilaNum(par),
    font: { sz:10, bold:true, color:{ rgb:'B45309' } },
  });
  const sVacio = { font:{sz:6}, fill:{fgColor:{rgb:BLANCO}} };

  function bordesTodos(color) {
    const b = { style:'thin', color:{ rgb:color } };
    return { top:b, bottom:b, left:b, right:b };
  }

  function c(v, s) { return { v, s, t: typeof v==='number'?'n':'s' }; }

  // ── Builder de hoja ───────────────────────────────────────────
  function buildSheet(secciones) {
    // secciones: [{ titulo, headers, rows, colWidths }]
    const aoa = []; // array of arrays de celdas con estilo

    // Fila de título general
    aoa.push([c(`VetClinic — Reporte ${titulo}`, sTitulo)]);
    aoa.push([c(`Período: ${desde} al ${hasta}`, sSubtitulo)]);
    aoa.push([c('', sVacio)]);

    secciones.forEach(sec => {
      // Título de sección
      aoa.push([c(sec.titulo, { ...sSubtitulo, font:{bold:true,sz:10,color:{rgb:VERDE_OSCURO}}, fill:{fgColor:{rgb:VERDE_CLARO}} })]);
      // Headers
      aoa.push(sec.headers.map((h,i) => c(h, i===0 ? sHeaderLeft : sHeader)));
      // Filas
      sec.rows.forEach((row, ri) => {
        const par = ri%2===0;
        aoa.push(row.map((cell, ci) => {
          const v = cell?.v !== undefined ? cell.v : cell;
          const isNum = typeof v === 'number' || (typeof v === 'string' && /^[\d.,]+$/.test(v) && !v.includes('-'));
          const style = cell?.s || (isNum && ci>0 ? sFilaNum(par) : sFila(par));
          return c(v, style);
        }));
      });
      aoa.push([c('', sVacio)]);
    });

    // Convertir a worksheet
    const ws = XS.utils.aoa_to_sheet(aoa.map(row => row.map(cell => cell.v)));

    // Aplicar estilos
    const range = XS.utils.decode_range(ws['!ref'] || 'A1');
    aoa.forEach((row, r) => {
      row.forEach((cell, c_) => {
        const addr = XS.utils.encode_cell({ r, c: c_ });
        if (!ws[addr]) ws[addr] = {};
        ws[addr].s = cell.s || sVacio;
        if (typeof cell.v === 'number') ws[addr].t = 'n';
      });
    });

    // Merge título y subtítulo en toda la fila
    const maxCols = Math.max(...aoa.map(r=>r.length), 1) - 1;
    ws['!merges'] = [
      { s:{r:0,c:0}, e:{r:0,c:maxCols} },
      { s:{r:1,c:0}, e:{r:1,c:maxCols} },
    ];

    // Alto de filas
    ws['!rows'] = aoa.map((_,i) => i===0?{hpt:28}:i===1?{hpt:18}:{hpt:18});

    // Ancho de columnas
    const primeraSec = secciones[0];
    if (primeraSec?.colWidths) {
      ws['!cols'] = primeraSec.colWidths.map(w => ({ wch:w }));
    } else {
      ws['!cols'] = Array(maxCols+1).fill(null).map((_,i) => {
        const maxLen = Math.max(...aoa.map(r => String(r[i]?.v||'').length), 8);
        return { wch: Math.min(maxLen+4, 40) };
      });
    }

    return ws;
  }

  const wb = XS.utils.book_new();

  switch(tabActiva) {

    case 'financiero': {
      const r = d.resumen;
      const totalMet = (d.porMetodo||[]).reduce((a,b)=>a+parseFloat(b.monto||0),0);
      const ws = buildSheet([
        {
          titulo: '📊 RESUMEN GENERAL',
          headers: ['Concepto','Valor'],
          colWidths: [35, 20],
          rows: [
            ['Total ingresos (pagados)', `S/. ${parseFloat(r.ingresos||0).toFixed(2)}`],
            ['Por cobrar (pendientes)',  `S/. ${parseFloat(r.por_cobrar||0).toFixed(2)}`],
            ['Total IGV recaudado',      `S/. ${parseFloat(r.total_igv||0).toFixed(2)}`],
            ['Total boletas',            `S/. ${parseFloat(r.boletas||0).toFixed(2)}`],
            ['Total facturas',           `S/. ${parseFloat(r.facturas||0).toFixed(2)}`],
            ['Documentos emitidos',      r.total_documentos||0],
            ['Pagados',                  r.pagados||0],
            ['Pendientes',               r.pendientes||0],
            ['Anulados',                 r.anulados||0],
          ],
        },
        {
          titulo: '📅 INGRESOS POR DÍA',
          headers: ['Fecha','Ingresos (S/.)','Documentos'],
          colWidths: [18, 20, 15],
          rows: (d.porDia||[]).map(x=>[x.dia, `S/. ${parseFloat(x.ingresos||0).toFixed(2)}`, x.documentos]),
        },
        {
          titulo: '💳 MÉTODOS DE PAGO',
          headers: ['Método','Monto (S/.)','Transacciones','% del total'],
          rows: (d.porMetodo||[]).map(m=>[
            m.metodo_pago,
            `S/. ${parseFloat(m.monto||0).toFixed(2)}`,
            m.transacciones,
            totalMet>0 ? ((parseFloat(m.monto)/totalMet)*100).toFixed(1)+'%' : '0%',
          ]),
        },
        {
          titulo: '🏆 TOP SERVICIOS FACTURADOS',
          headers: ['#','Servicio','Cantidad','Monto Total (S/.)'],
          rows: (d.topServicios||[]).map((s,i)=>[i+1, s.descripcion, s.cantidad, `S/. ${parseFloat(s.monto_total||0).toFixed(2)}`]),
        },
        {
          titulo: '⏳ PENDIENTES DE COBRO',
          headers: ['Número','Fecha','Cliente','Tipo','Total (S/.)'],
          rows: (d.pendientes||[]).map(p=>[p.numero, p.fecha, p.cliente, p.tipo, `S/. ${parseFloat(p.total||0).toFixed(2)}`]),
        },
      ]);
      XS.utils.book_append_sheet(wb, ws, 'Financiero');
      break;
    }

    case 'citas': {
      const r = d.resumen;
      const ws = buildSheet([
        {
          titulo: '📊 RESUMEN DE CITAS',
          headers: ['Estado','Cantidad'],
          colWidths: [25, 15],
          rows: [
            ['Total citas', r.total||0],
            ['Completadas', r.completadas||0],
            ['Confirmadas', r.confirmadas||0],
            ['En curso',    r.en_curso||0],
            ['Pendientes',  r.pendientes||0],
            ['Canceladas',  r.canceladas||0],
          ],
        },
        {
          titulo: '🩺 RENDIMIENTO POR VETERINARIO',

        },
        {
          titulo: '📅 INGRESOS POR DÍA',
          headers: ['Fecha','Servicios','Ingresos (S/.)'],
          rows: (d.porDia||[]).map(x=>[x.dia, x.total, `S/. ${parseFloat(x.ingresos||0).toFixed(2)}`]),
        },
      ]);
      XS.utils.book_append_sheet(wb, ws, 'Estética');
      break;
    }

    case 'veterinarios': {
      const ws = buildSheet([
        {
          titulo: '🩺 RENDIMIENTO POR VETERINARIO',
          headers: ['Veterinario','Total citas','Completadas','Canceladas','Efectividad (%)','Consultas','Vacunas aplicadas'],
          colWidths: [28, 14, 14, 14, 18, 12, 18],
          rows: (d.veterinarios||[]).map(v=>[
            v.nombre,
            v.citas_total||0,
            v.citas_completadas||0,
            v.citas_canceladas||0,
            v.citas_total>0 ? ((v.citas_completadas/v.citas_total)*100).toFixed(1)+'%' : '0%',
            v.consultas||0,
            v.vacunas||0,
          ]),
        },
      ]);
      XS.utils.book_append_sheet(wb, ws, 'Veterinarios');
      break;
    }

    case 'resumen': {
      const et = { ingresos:'Ingresos', ticket_promedio:'Ticket promedio', clientes_atendidos:'Clientes atendidos',
        clientes_nuevos:'Clientes nuevos', citas:'Citas', tasa_cancelacion:'Citas canceladas (%)',
        consultas:'Consultas', mascotas_nuevas:'Mascotas nuevas' };
      const ws = buildSheet([{
        titulo: `RESUMEN ${d.periodo.desde} a ${d.periodo.hasta} vs ${d.periodo_anterior.desde} a ${d.periodo_anterior.hasta}`,
        headers: ['Indicador','Período','Período anterior','Variación'],
        colWidths: [28, 18, 18, 14],
        rows: Object.keys(et).map(k => [et[k], d.actual[k], d.anterior[k],
          d.cambio[k] === null ? 'nuevo' : d.cambio[k] + '%']),
      }, {
        titulo: 'ALERTAS (situación actual)',
        headers: ['Alerta','Valor'],
        rows: [
          ['Por cobrar total', money(d.alertas.por_cobrar)],
          ['Por cobrar con más de 30 días', money(d.alertas.por_cobrar_30)],
          ['Vacunas vencidas (último mes)', d.alertas.vacunas_vencidas_30],
          ['Vacunas que vencen en 7 días', d.alertas.vacunas_proximas_7],
          ['Productos con stock bajo', d.alertas.stock_bajo],
          ['Productos que vencen en 30 días', d.alertas.inventario_por_vencer],
        ],
      }]);
      XS.utils.book_append_sheet(wb, ws, 'Resumen');
      break;
    }

    case 'gastos': {
      const r = d.resumen;
      const ws = buildSheet([{
        titulo: 'RESUMEN DE GASTOS', headers: ['Concepto','Valor'], colWidths: [30, 26, 34, 16, 24, 20, 16],
        rows: [
          ['Total gastado', money(r.total)], ['Gastos registrados', r.cantidad],
          ['Promedio por día', money(r.promedio_diario)], ['Gasto más alto', money(r.mayor)],
          ['Período anterior', money(r.anterior)], ['Variación', r.variacion === null ? 'nuevo' : r.variacion + '%'],
          ['Ingresos cobrados', money(r.ingresos)], ['Ingresos − gastos', money(r.utilidad)],
          ['Margen', r.margen === null ? '—' : r.margen + '%'],
          ['Anulados (no incluidos)', `${r.anulados} · ${money(r.anulados_monto)}`],
        ],
      }, {
        titulo: 'POR TIPO DE GASTO', headers: ['Tipo','Cantidad','Total','%'],
        rows: d.porCategoria.map(c => [c.nombre, +c.cantidad, money(c.total), c.pct + '%']),
      }, {
        titulo: 'POR MÉTODO DE PAGO', headers: ['Método','Cantidad','Total','%'],
        rows: d.porMetodo.map(m => [m.metodo_pago, +m.cantidad, money(m.total), m.pct + '%']),
      }, {
        titulo: d.agrupacion === 'mes' ? 'POR MES' : 'POR DÍA', headers: ['Período','Gastos','Total'],
        rows: d.porPeriodo.map(x => [x.periodo, +x.cantidad, money(x.total)]),
      }, {
        titulo: 'DETALLE', headers: ['Fecha','Tipo','Descripción','Método','Proveedor / Comprobante','Registrado por','Monto'],
        rows: d.detalle.map(g => [g.fecha, g.categoria, g.descripcion, g.metodo_pago,
          [g.proveedor, g.comprobante].filter(Boolean).join(' · '), g.registrado_por, money(g.monto)]),
      }]);
      XS.utils.book_append_sheet(wb, ws, 'Gastos');
      break;
    }

    case 'clientes': {
      const r = d.resumen;
      const ws = buildSheet([{
        titulo: 'RESUMEN DE CLIENTES', headers: ['Concepto','Valor'], colWidths: [34, 40, 18, 16, 18],
        rows: [['Clientes atendidos', r.atendidos], ['Primera compra', r.nuevos], ['Recurrentes', r.recurrentes],
          ['Gasto promedio por cliente', money(r.gasto_promedio)], ['Ticket promedio', money(r.ticket_promedio)],
          ['Ventas sin cliente (Público general)', money(r.ingresos_sin_cliente)]],
      }, {
        titulo: 'MEJORES CLIENTES', headers: ['Cliente','Teléfono','Compras','Gasto','Última compra'],
        rows: d.top.map(t => [t.cliente, t.telefono || '', t.compras, money(t.gasto), String(t.ultima).slice(0,10)]),
      }, {
        titulo: `CLIENTES SIN VENIR HACE ${d.dias_inactivo}+ DÍAS`, headers: ['Cliente','Teléfono','Mascotas','Última visita','Gasto histórico'],
        rows: d.inactivos.map(x => [x.cliente, x.telefono || '', x.mascotas || '', String(x.ultima_visita).slice(0,10), money(x.gasto_total)]),
      }]);
      XS.utils.book_append_sheet(wb, ws, 'Clientes');
      break;
    }

    case 'cobranzas': {
      const ws = buildSheet([{
        titulo: `CUENTAS POR COBRAR AL ${d.fecha_corte}`, headers: ['Antigüedad','Comprobantes','Monto'], colWidths: [28, 16, 18, 14, 16],
        rows: d.tramos.map(t => [t.tramo, t.documentos, money(t.monto)]).concat([['TOTAL', d.resumen.documentos, money(d.resumen.total)]]),
      }, {
        titulo: 'POR CLIENTE', headers: ['Cliente','Teléfono','Comprobantes','Deuda','Días (más antigua)'],
        rows: d.porCliente.map(x => [x.cliente, x.telefono || '', x.documentos, money(x.total), x.dias_max]),
      }, {
        titulo: 'DETALLE', headers: ['Número','Fecha','Cliente','Días','Total'],
        rows: d.detalle.map(x => [x.numero, String(x.fecha).slice(0,10), x.cliente, x.dias, money(x.total)]),
      }]);
      XS.utils.book_append_sheet(wb, ws, 'Cobranzas');
      break;
    }

    case 'demanda': {
      const nombres = { 1:'Domingo', 2:'Lunes', 3:'Martes', 4:'Miércoles', 5:'Jueves', 6:'Viernes', 7:'Sábado' };
      const ws = buildSheet([{
        titulo: 'CITAS POR DÍA Y HORA', headers: ['Día','Hora','Citas','Canceladas'], colWidths: [22, 12, 12, 14],
        rows: [...d.mapa].sort((a, b) => ((a.dow + 5) % 7) - ((b.dow + 5) % 7) || a.hora - b.hora)
          .map(m => [nombres[m.dow], `${m.hora}:00`, +m.total, +m.canceladas]),
      }, {
        titulo: 'POR TIPO DE ATENCIÓN', headers: ['Tipo','Citas','Completadas','Canceladas'],
        rows: d.porTipo.map(t => [t.tipo_cita, +t.total, +t.completadas, +t.canceladas]),
      }, {
        titulo: 'MOTIVOS MÁS FRECUENTES', headers: ['Motivo','Citas'],
        rows: d.motivos.map(m => [m.motivo, +m.total]),
      }]);
      XS.utils.book_append_sheet(wb, ws, 'Demanda');
      break;
    }
  }

  XS.writeFile(wb, `VetClinic_${titulo}_${desde}_${hasta}.xlsx`);
  toast('✅ Excel descargado', 'success');
}

// ── PDF ───────────────────────────────────────────────────────────

  const desde  = document.getElementById('r-desde').value;
  const hasta  = document.getElementById('r-hasta').value;
  const titulo = { financiero:'Financiero', gastos:'Gastos', citas:'Citas', mascotas:'Mascotas',
                   vacunas:'Vacunas', inventario:'Inventario', estetica:'Estética',
                   veterinarios:'Veterinarios' }[tabActiva] || tabActiva;

  const contenido = document.getElementById(`contenido-${tabActiva}`)?.innerHTML || '';
  const ventana   = window.open('', '_blank');
  ventana.document.write(`<!DOCTYPE html><html><head>
    <meta charset="UTF-8"/>
    <title>Reporte ${titulo}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
      * { margin:0;padding:0;box-sizing:border-box; }
      body { font-family:'Inter',sans-serif;padding:2rem;color:#111;font-size:12px; }
      h1 { font-size:1.4rem;font-weight:800;margin-bottom:.3rem;color:var(--green-800); }
      h3 { font-size:1rem;font-weight:700;margin-bottom:.75rem; }
      .kpi { display:inline-block;border:1px solid #e5e7eb;border-radius:.75rem;
             padding:.75rem 1rem;margin:.3rem; }
      .kpi-val { font-size:1.5rem;font-weight:800; }
      .kpi-label { font-size:.6rem;color:#6b7280;text-transform:uppercase;letter-spacing:.08em; }
      .vcard { border:1px solid #e5e7eb;border-radius:.75rem;margin-bottom:1rem;overflow:hidden; }
      .vcard-pad { padding:1rem; }
      .rep-table { width:100%;border-collapse:collapse;font-size:.75rem; }
      .rep-table th { background:#f9fafb;padding:.5rem .75rem;text-align:left;
                      font-size:.6rem;color:#6b7280;text-transform:uppercase;letter-spacing:.1em;
                      border-bottom:1px solid #e5e7eb; }
      .rep-table td { padding:.55rem .75rem;border-bottom:1px solid #f3f4f6; }
      .bar-h { height:6px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:.2rem; }
      .bar-h-fill { height:100%;border-radius:999px;background:var(--green-500); }
      .badge-vencida { background:#fff1f2;color:#be123c;border:1px solid #fecdd3;
                       font-size:.6rem;font-weight:700;padding:.1rem .4rem;border-radius:999px; }
      .badge-proxima { background:#fffbeb;color:#b45309;border:1px solid #fde68a;

    </style>
  </head><body>
    <div style="border-bottom:2px solid var(--green-800);padding-bottom:1rem;margin-bottom:1.5rem">
      <h1>VetClinic — Reporte ${titulo}</h1>

    </div>
    ${contenido}
    <br/>
    <div style="text-align:center">
      <button onclick="window.print()"
        style="display:inline-block!important;background:var(--green-800);color:#fff;border:none;
        padding:.6rem 1.5rem;border-radius:.5rem;font-size:.85rem;font-weight:700;cursor:pointer">
        🖨️ Imprimir / Guardar PDF
      </button>
    </div>

  setTimeout(() => ventana.print(), 1000);

// ── RENTABILIDAD ──────────────────────────────────────────────────
function renderRentabilidad(d) {
  var k       = d.kpis || {};
  var ingreso  = parseFloat(k.ingreso_total || 0);
  var costo    = parseFloat(k.costo_total   || 0);
  var ganancia = parseFloat(k.ganancia_neta || 0);
  var margen   = parseFloat(k.margen_pct    || 0);
  var colorM   = margen>=50?'#15803d':margen>=20?'#b45309':'#be123c';
  var maxGan   = Math.max.apply(null, (d.porDia||[]).map(function(x){ return parseFloat(x.ganancia)||0; }).concat([1]));
  var filtro   = d.filtro || 'todos';

  var avisos = {
    todos     : 'Mostrando <strong>todos los ítems</strong>. El costo aplica solo a productos con precio de compra; los servicios se muestran con ganancia al 100%.',
    productos : 'Mostrando solo <strong>productos de inventario</strong> con precio de compra registrado.',
    servicios : 'Mostrando solo <strong>servicios</strong> (consultas, vacunas, baños, etc.).',
  };

  var html = '';

  // ── Filtros ──
  html += '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem">';
  ['todos','productos','servicios'].forEach(function(f) {
    var labels = { todos:'📊 Todos', productos:'📦 Solo productos', servicios:'🩺 Solo servicios' };
    var cls = filtro===f ? 'vbtn vbtn-primary' : 'vbtn vbtn-ghost';
    html += '<button onclick="cambiarFiltroRent(\''+f+'\')" class="'+cls+'" style="font-size:.8rem;padding:.4rem .9rem">'+labels[f]+'</button>';
  });
  html += '</div>';

  // ── Aviso ──
  html += '<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:.85rem;padding:.75rem 1rem;margin-bottom:1.3rem;font-size:.78rem;color:#c2410c">ℹ️ '+(avisos[filtro]||'')+'</div>';

  // ── KPIs ──
  html += '<div class="grid grid-cols-2 sm:grid-cols-4 gap-4" style="margin-bottom:1.3rem">';
  html += kpi('S/. '+ingreso.toFixed(2),  'Ingreso total',   '#1d4ed8');
  html += kpi('S/. '+costo.toFixed(2),    'Costo total',     '#be123c');
  html += kpi('S/. '+ganancia.toFixed(2), 'Ganancia neta',   'var(--green-700)');
  html += kpi(margen.toFixed(1)+'%',      'Margen en productos', colorM);
  html += '</div>';
  // El margen solo puede medirse donde hay costo de compra; los servicios no lo tienen
  html += '<p style="font-size:.75rem;color:var(--ink-faint);margin:-.6rem 0 1.3rem">El margen se calcula sobre productos con precio de compra registrado ('
       + (parseFloat(k.cobertura_costo_pct)||0) + '% de las ventas). Los servicios no tienen costo cargado, por eso no se incluyen.</p>';

  // ── Ganancia por día ──
  html += '<div class="vcard vcard-pad" style="margin-bottom:1.3rem">';
  html += '<h3 style="font-family:\'Playfair Display\',serif;font-weight:700;font-size:.95rem;margin-bottom:1rem">📈 Ganancia por día</h3>';
  html += '<div style="display:flex;flex-direction:column;gap:.5rem">';
  (d.porDia||[]).forEach(function(dia) {
    var ing = parseFloat(dia.ingreso||0);
    var cos = parseFloat(dia.costo||0);
    var gan = parseFloat(dia.ganancia||0);
    var pct = maxGan > 0 ? Math.max((gan/maxGan)*100, 2).toFixed(0) : 0;
    var col = gan >= 0 ? '#15803d' : '#be123c';
    html += '<div style="display:flex;align-items:center;gap:.75rem">';
    html += '<span style="font-size:.72rem;color:var(--ink-faint);font-family:monospace;min-width:70px">'+fDate(dia.dia)+'</span>';
    html += '<div style="flex:1"><div style="background:#f0f0f0;border-radius:999px;height:8px;overflow:hidden">';
    html += '<div style="height:100%;border-radius:999px;background:'+col+';width:'+pct+'%"></div></div></div>';
    html += '<div style="text-align:right;min-width:140px">';
    html += '<span style="font-size:.78rem;font-weight:700;color:'+col+'">S/. '+gan.toFixed(2)+'</span>';
    html += '<span style="font-size:.65rem;color:var(--ink-faint);display:block">Ing: S/.'+ing.toFixed(2)+' · Costo: S/.'+cos.toFixed(2)+'</span>';
    html += '</div></div>';
  });
  html += '</div></div>';

  // ── Top productos ──
  if (filtro !== 'servicios') {
    html += '<div class="vcard vcard-pad" style="margin-bottom:1.3rem">';
    html += '<h3 style="font-family:\'Playfair Display\',serif;font-weight:700;font-size:.95rem;margin-bottom:1rem">🏆 Productos más rentables</h3>';
    if (d.topProductos && d.topProductos.length) {
      html += '<table class="rep-table"><thead><tr>';
      html += '<th>Producto</th><th style="text-align:right">Cant.</th><th style="text-align:right">Ingreso</th>';
      html += '<th style="text-align:right">Costo</th><th style="text-align:right">Ganancia</th><th style="text-align:right">Margen</th>';
      html += '</tr></thead><tbody>';
      (d.topProductos||[]).forEach(function(p) {
        var mar  = parseFloat(p.margen_pct||0);
        var colM = mar>=50?'#15803d':mar>=20?'#b45309':'#be123c';
        html += '<tr>';
        html += '<td style="font-weight:600">'+esc(p.descripcion)+'</td>';
        html += '<td style="text-align:right">'+parseFloat(p.cantidad_total).toFixed(2)+'</td>';
        html += '<td style="text-align:right">S/. '+parseFloat(p.ingreso_total).toFixed(2)+'</td>';
        html += '<td style="text-align:right;color:#be123c">S/. '+parseFloat(p.costo_total).toFixed(2)+'</td>';
        html += '<td style="text-align:right;font-weight:700;color:var(--green-700)">S/. '+parseFloat(p.ganancia).toFixed(2)+'</td>';
        html += '<td style="text-align:right;font-weight:700;color:'+colM+'">'+mar.toFixed(1)+'%</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';
    } else {
      html += '<div class="vempty" style="padding:1.5rem">Sin productos con precio de compra registrado.<br/>';
      html += '<small style="color:var(--ink-faint)">Actualiza los precios de compra en el inventario.</small></div>';
    }
    html += '</div>';
  }

  // ── Top servicios ──
  if (filtro !== 'productos' && d.topServicios && d.topServicios.length) {
    html += '<div class="vcard vcard-pad">';
    html += '<h3 style="font-family:\'Playfair Display\',serif;font-weight:700;font-size:.95rem;margin-bottom:1rem">🩺 Servicios más facturados</h3>';
    html += '<table class="rep-table"><thead><tr>';
    html += '<th>Servicio</th><th style="text-align:right">Cant.</th>';
    html += '<th style="text-align:right">Ingreso total</th><th style="text-align:right">Ganancia</th>';
    html += '</tr></thead><tbody>';
    (d.topServicios||[]).forEach(function(s) {
      html += '<tr>';
      html += '<td style="font-weight:600">'+esc(s.descripcion)+'</td>';
      html += '<td style="text-align:right">'+parseFloat(s.cantidad_total).toFixed(2)+'</td>';
      html += '<td style="text-align:right">S/. '+parseFloat(s.ingreso_total).toFixed(2)+'</td>';
      html += '<td style="text-align:right;font-weight:700;color:var(--green-700)">S/. '+parseFloat(s.ingreso_total).toFixed(2);
      html += '<span style="font-size:.65rem;color:var(--ink-faint);display:block">100% margen</span></td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  }

  return html;
}
</script>
