<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0d3b2e"/>
  <title>Sin conexión — VetClinic</title>
  <link rel="icon" type="image/png" href="/icons/favicon-32.png"/>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      background: #faf9f6; color: #1a2e28;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
      text-align: center;
    }
    .box { max-width: 360px; }
    img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 10px 30px rgba(13,59,46,.15); }
    h1 { font-size: 1.35rem; margin: 1.4rem 0 .5rem; }
    p  { font-size: .92rem; color: #5b6d66; line-height: 1.55; }
    button {
      margin-top: 1.6rem; min-height: 48px; padding: 0 1.6rem;
      border: none; border-radius: 14px; cursor: pointer;
      background: linear-gradient(135deg, #10b981, #059669); color: #fff;
      font-size: .95rem; font-weight: 600; font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt=""/>
    <h1>Sin conexión a internet</h1>
    <p>No pudimos cargar esta pantalla. Revisa tu Wi-Fi o datos móviles y vuelve a intentarlo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
